<div class="mb-5 flex w-full items-center justify-between gap-2 px-2">
  <!-- View Switcher -->
  <hlm-tabs tab="list">
    <hlm-tabs-list>
      <button hlmTabsTrigger="list" (click)="onSwitch('list')" class="cursor-pointer">
        <ng-icon name="fluentAppsList" />
      </button>
      <button hlmTabsTrigger="grid" (click)="onSwitch('grid')" class="cursor-pointer">
        <ng-icon name="fluentGrid" />
      </button>
    </hlm-tabs-list>
  </hlm-tabs>

  @if (selectedCount() > 0) {
    <button hlmBtn variant="destructive" class="shrink-0" type="button" (click)="onDeleteSelected()">
      <ng-icon name="lucideTrash2" />
      Delete selected
    </button>
  }
</div>
