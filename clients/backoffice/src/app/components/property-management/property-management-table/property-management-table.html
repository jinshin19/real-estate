<div hlmTableContainer>
  <table hlmTable class="w-full">
    <thead hlmTableHeader>
      <tr hlmTableRow>
        <th hlmTableHead class="w-12">
          <hlm-checkbox />
        </th>

        <th hlmTableHead>Property</th>
        <th hlmTableHead>Type</th>
        <th hlmTableHead>Listing</th>
        <th hlmTableHead>Status</th>
        <th hlmTableHead>Location</th>
        <th hlmTableHead class="text-right">Price</th>
      </tr>
    </thead>

    <tbody hlmTableBody>
      @for (property of properties(); track property.id) {
        <tr hlmTableRow>
          <td hlmTableCell>
            <hlm-checkbox />
          </td>

          <td hlmTableCell>
            <div class="flex flex-col">
              <span class="font-medium">
                {{ property.title }}
              </span>

              <span class="text-muted-foreground text-sm">
                {{ property.projectId }}
              </span>
            </div>
          </td>

          <td hlmTableCell>
            <!-- {{ property.type }} -->
            Townhouse
          </td>

          <td hlmTableCell>
            <!-- {{ property.listing }} -->
            For Sale
          </td>

          <td hlmTableCell>
            {{ property.status }}
          </td>

          <td hlmTableCell>
            {{ property.location.city }}
          </td>

          <td hlmTableCell class="text-right font-medium">
            {{ property.price }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
