<div class="w-full">
  <hlm-dialog
    [state]="createPropertyModalState()"
    (stateChanged)="createPropertyModalState.set($event)"
  >
    <hlm-dialog-content
      *hlmDialogPortal="let ctx"
      dialogContentClass="max-h-[90vh] overflow-y-auto sm:max-w-3xl"
    >
      <hlm-dialog-header>
        <h3 hlmDialogTitle class="text-xl">Create Property</h3>
        <p hlmDialogDescription>Add your property photos and information.</p>
      </hlm-dialog-header>

      <div>
        <hlm-field-group>
          <form id="create-property-form" [formGroup]="createPropertyForm">
            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <hlm-field>
                <label hlmFieldLabel for="create-property-name">Property Name</label>
                <input
                  hlmInput
                  id="create-property-name"
                  placeholder="e.g. Modern Family Home"
                  class="rounded-md"
                  formControlName="title"
                />
              </hlm-field>
              <hlm-field>
                <label hlmFieldLabel for="create-property-type">Property Type</label>
                <input
                  hlmInput
                  id="create-property-type"
                  placeholder="House, Apartment, Condo..."
                  class="rounded-md"
                  formControlName="type"
                />
              </hlm-field>
            </div>
          </form>
        </hlm-field-group>
      </div>

      <hlm-dialog-footer class="mt-8">
        <button hlmBtn variant="outline" hlmDialogClose type="button">Cancel</button>
        <button hlmBtn type="button" [disabled]="isCreating()" (click)="onCreate()">
          Create
          <ng-icon name="lucideArrowRight" />
        </button>
      </hlm-dialog-footer>
    </hlm-dialog-content>
  </hlm-dialog>
</div>
