<div>
  @if (mode().module === 'property-management' && mode().mode === 'list') {
    <app-property-management-table [properties]="propertyService.properties()" />
  } @else if (mode().module === 'property-management' && mode().mode === 'grid') {
    <div class="grid grid-cols-5 gap-5">
      @for (property of propertyService.properties(); track $index) {
        <app-property-management-card [property]="property" mode="grid" />
      }
    </div>
  } @else {
    <div class="flex flex-col gap-5">
      <app-property-management-table [properties]="propertyService.properties()" />
    </div>
  }
</div>
