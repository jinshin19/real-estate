<div class="w-full py-40">
  <!-- Top -->
  <div class="flex-1 mb-5">
    <p class="text-2xl font-semibold mb-1">Featured Properties</p>
    <p class="w-[50%]">Handpicked properties just for you</p>
  </div>
  <!-- Bottom -->
  <div class="rounded-2xl">
    <hlm-carousel class="w-full">
      <hlm-carousel-content>
        @for (item of items; track item) {
          <hlm-carousel-item class="md:basis-1/2 lg:basis-1/3">
            <div class="p-1">
              <app-card />
            </div>
          </hlm-carousel-item>
        }
      </hlm-carousel-content>
    </hlm-carousel>
  </div>
</div>
