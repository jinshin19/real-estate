<hlm-card
  class="relative mx-auto w-full max-w-sm pt-0 gap-4 cursor-pointer"
  [routerLink]="['/properties', id]"
>
  <div class="relative">
    <!-- <img
      src="https://images.unsplash.com/photo-1604076850742-4c7221f3101b?q=80&w=1887&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
      alt="Event cover"
      class="relative z-20 aspect-video w-full object-cover brightness-60 grayscale dark:brightness-40"
    /> -->
    <img
      src="hero-section.jpg"
      alt="Event cover"
      class="relative z-20 aspect-video w-full object-cover"
    />
    <span hlmBadge class="uppercase absolute left-0 bottom-0 z-20 ml-2 mb-2">Townhouse</span>
  </div>
  <hlm-card-header>
    <h3 hlmCardTitle class="text-[20px]">Modern Townhouse</h3>
    <p hlmCardDescription class="flex items-center gap-1">
      <ng-icon name="fluentLocation" size="18" />
      <span class="font-semibold">Valenzuela City</span>
    </p>
  </hlm-card-header>
  <hlm-card-footer class="font-bold text-[18px]">
    <p>$ 500,000</p>
  </hlm-card-footer>
</hlm-card>
