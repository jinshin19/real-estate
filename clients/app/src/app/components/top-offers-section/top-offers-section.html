<div class="w-full py-40">
  <!-- Top -->
  <div class="flex-1 mb-5">
    <p class="text-2xl font-semibold mb-1">Top Offers</p>
    <p class="w-[50%]">
      Fulfill your career dreams, enjoy all the achievements of the city center and luxury housing
      to the fullest.
    </p>
  </div>
  <!-- Bottom -->
  <div class="outline rounded-2xl">
    <hlm-carousel class="w-full">
      <hlm-carousel-content>
        @for (item of items; track item) {
          <hlm-carousel-item class="md:basis-1/2 lg:basis-1/3">
            <div class="p-1">
              <section hlmCard>
                <p hlmCardContent class="flex aspect-square items-center justify-center p-6">
                  <span class="text-3xl font-semibold">{{ item }}</span>
                </p>
              </section>
            </div>
          </hlm-carousel-item>
        }
      </hlm-carousel-content>
    </hlm-carousel>
  </div>
</div>
